spring:
    application:
        name: hihousing
    
    datasource:
        url: jdbc:postgresql://localhost:5432/hi_db
        username: ${db_username}
        password: ${db_password}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        locations: classpath:db/migration


server:
    port: 10010
    servlet:
        context-path: /api

app:
    ai:
        provider: qwen

langchain4j:
    community:
        dashscope:
            chat-model:
                model-name: qwen-max
                api-key: ${qwen_api_key}
    google-ai-gemini:
        chat-model:
            model-name: gemini-2.5-flash-lite
            api-key: ${gemini_api_key}
            temperature: 0.7
